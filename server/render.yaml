services:
  - type: web
    name: smart-translate-api
    runtime: node
    plan: free
    buildCommand: npm install && pip install -r requirements.txt
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5000
      - key: TRANSLATE_API_URL
        value: https://translate.googleapis.com/translate_a/single
